name: Flutter

on:
  push:
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git rev-parse --verify "$base_ref^{commit}" >/dev/null 2>&1; then
            base_ref="HEAD^"
          fi

          mapfile -t dart_files < <(
            git diff --name-only --diff-filter=ACMRTUXB "$base_ref" HEAD -- '*.dart' |
              grep -Ev '^(lib/src/generated/i18n|packages/flutter_inappwebview_linux)/' || true
          )
          if ((${#dart_files[@]})); then
            dart format --output=none --set-exit-if-changed "${dart_files[@]}"
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-android:
    uses: ./.github/workflows/android-build.yml
    secrets: inherit
    with:
      flutter_version: 3.47.2
      workflow_profile: ci
      build_mode: ci_full_dev
      artifact_name: Apk
      enable_build_cache: true
      enable_gradle_cache: true
      signing_required: false
      include_metadata_defines: true
      include_dev_define: true

  build-windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      flutter_version: 3.47.2
      workflow_profile: ci
      artifact_name: Windows
      enable_build_cache: true
      include_metadata_defines: true
      include_dev_define: true
      package_release_artifacts: false

  build-linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      flutter_version: 3.47.2
      workflow_profile: ci
      artifact_name: Linux
      include_metadata_defines: true
      include_dev_define: true
