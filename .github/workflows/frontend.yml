name: Frontend

on:
  push:
    paths:
      - "frontend/**"
      - "assets/third_party/darkreader/darkreader.js"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "assets/third_party/darkreader/darkreader.js"
      - ".github/workflows/frontend.yml"

jobs:
  check-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          version: latest
          working-directory: frontend
          runtime: node@lts
          cache: true
          require-lockfile: true

      - name: Check code formatting (oxfmt)
        run: pnpm run format:check

      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Type check (tsc)
        run: pnpm run compile

      - name: Run unit tests (vitest)
        run: pnpm test

      - name: Build packages (shared, browser_extension, web_ui)
        run: pnpm run build

      - name: Build browser extension for Firefox
        run: pnpm --filter ciyue-browser-extension build:firefox
