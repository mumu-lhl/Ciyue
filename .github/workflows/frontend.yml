name: Frontend

on:
  push:
    paths:
      - "frontend/**"
      - "assets/third_party/darkreader/darkreader.js"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "assets/third_party/darkreader/darkreader.js"
      - ".github/workflows/frontend.yml"

jobs:
  check-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check code formatting (bun fmt)
        run: bun run format:check

      - name: Lint (oxlint)
        run: bun run lint

      - name: Type check (bun check)
        run: bun run check

      - name: Run unit tests (vitest)
        run: bun run test

      - name: Build packages (shared, browser_extension, web_ui)
        run: bun run build

      - name: Build browser extension for Firefox
        run: bun --filter ciyue-browser-extension build:firefox
