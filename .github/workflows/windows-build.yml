name: Windows Build

on:
  workflow_call:
    inputs:
      flutter_version:
        required: true
        type: string
      workflow_profile:
        required: false
        type: string
        default: "ci"
      artifact_name:
        required: false
        type: string
        default: "Windows"
      enable_build_cache:
        required: false
        type: boolean
        default: false
      include_metadata_defines:
        required: false
        type: boolean
        default: false
      include_dev_define:
        required: false
        type: boolean
        default: false
      package_release_artifacts:
        required: false
        type: boolean
        default: false
      msix_skip_clean:
        required: false
        type: boolean
        default: false

jobs:
  build-windows:
    name: Build Windows (${{ inputs.workflow_profile }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Detect Windows CMake toolchain
        if: ${{ inputs.enable_build_cache }}
        id: windows-toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "Could not find vswhere.exe"
          }

          $installationVersion = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion | Out-String).Trim()
          $installationPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($installationVersion) -or [string]::IsNullOrWhiteSpace($installationPath)) {
            throw "Could not find a usable Visual Studio CMake toolchain"
          }

          $majorVersion = [int]($installationVersion.Split('.')[0])
          $generator = switch ($majorVersion) {
            18 { "Visual Studio 18 2026" }
            17 { "Visual Studio 17 2022" }
            default { "Visual Studio 16 2019" }
          }

          Write-Host "Using Visual Studio $installationVersion at $installationPath"
          Write-Host "Using CMake generator $generator"
          "version=$installationVersion" >> $env:GITHUB_OUTPUT
          "generator=$generator" >> $env:GITHUB_OUTPUT

      - name: Cache Flutter Build
        if: ${{ inputs.enable_build_cache }}
        uses: actions/cache@v5
        with:
          path: |
            .dart_tool
            build
          key: ${{ runner.os }}-build-${{ steps.windows-toolchain.outputs.version }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ steps.windows-toolchain.outputs.version }}-

      - name: Clean stale Windows CMake cache
        if: ${{ inputs.enable_build_cache }}
        shell: pwsh
        env:
          EXPECTED_CMAKE_GENERATOR: ${{ steps.windows-toolchain.outputs.generator }}
        run: |
          $cache = Get-ChildItem -Path "build/windows" -Filter "CMakeCache.txt" -File -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $cache) {
            Write-Host "No cached Windows CMake configuration found"
            exit 0
          }

          $generatorLine = Select-String -Path $cache.FullName -Pattern '^CMAKE_GENERATOR:INTERNAL=' |
            Select-Object -First 1
          $cachedGenerator = if ($generatorLine) {
            $generatorLine.Line -replace '^CMAKE_GENERATOR:INTERNAL=', ''
          } else {
            ''
          }

          if ($cachedGenerator -ne $env:EXPECTED_CMAKE_GENERATOR) {
            Write-Host "Discarding stale CMake cache: '$cachedGenerator' != '$env:EXPECTED_CMAKE_GENERATOR'"
            Remove-Item -Recurse -Force build/windows -ErrorAction SilentlyContinue
          } else {
            Write-Host "Reusing cached CMake configuration for $cachedGenerator"
          }

      - name: Build Windows
        shell: pwsh
        run: |
          $extraArgs = @()
          if ("${{ inputs.include_dev_define }}" -eq "true") {
            $extraArgs += "--dart-define=DEV=true"
          }
          if ("${{ inputs.include_metadata_defines }}" -eq "true") {
            $hash = git rev-parse --short HEAD
            $timestamp = [int64](((Get-Date).ToUniversalTime()) - (Get-Date "1970-01-01")).TotalSeconds
            $extraArgs += "--dart-define=GIT_COMMIT_HASH=$hash"
            $extraArgs += "--dart-define=BUILD_TIMESTAMP=$timestamp"
          }

          # VS 2026 / MSVC 14.51 turns use of <experimental/coroutine> into
          # STL1011 static assertion failures. Some transitive Flutter Windows
          # plugins still include those headers, so suppress the compatibility
          # warning globally until the upstream plugins move to C++20 <coroutine>.
          $env:CL = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS $env:CL"

          # CMake otherwise leaves the Visual Studio build at its default
          # parallelism, which makes the native Windows build unnecessarily
          # slow on hosted runners.
          $env:CMAKE_BUILD_PARALLEL_LEVEL = [Environment]::ProcessorCount
          Write-Host "Using CMake build parallelism: $env:CMAKE_BUILD_PARALLEL_LEVEL"

          flutter build windows @extraArgs

      - name: Normalize Flutter Windows bundle path
        shell: pwsh
        run: |
          $legacyReleaseDir = "build/windows/x64/runner/Release"
          $legacyReleasePath = [System.IO.Path]::GetFullPath($legacyReleaseDir)
          $releaseDir = Get-ChildItem -Path "build/windows/x64" -Directory -Recurse |
            Where-Object {
              $_.FullName -match '[\\/]runner[\\/]Release$' -and
              [System.IO.Path]::GetFullPath($_.FullName) -ne $legacyReleasePath
            } |
            Select-Object -First 1

          if (-not $releaseDir) {
            if (Test-Path $legacyReleaseDir) {
              exit 0
            }
            throw "Could not locate the Flutter Windows release bundle"
          }

          # Keep Flutter's canonical CMake output in the cache. The copied
          # legacy path is only used by artifact packaging.
          if (Test-Path $legacyReleaseDir) {
            Remove-Item -Recurse -Force $legacyReleaseDir
          }
          New-Item -ItemType Directory -Force -Path $legacyReleaseDir | Out-Null
          Copy-Item -Path (Join-Path $releaseDir.FullName "*") -Destination $legacyReleaseDir -Recurse -Force

      - name: Copy DLLs
        shell: pwsh
        run: |
          # Do not hard-code the Visual Studio year or MSVC redist version.
          # windows-latest is moving to windows-2025-vs2026, and that image may
          # omit the older VS2022 redist directory that this workflow used to copy
          # from. Prefer redist CRT directories when present, but fall back to the
          # runner's installed x64 CRT DLLs so CI artifacts can still be uploaded.
          $releaseDir = "build/windows/x64/runner/Release"
          $dllNames = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")

          $visualStudioRoots = @()
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (Test-Path $vswhere) {
            $visualStudioRoots += & $vswhere -all -products * -property installationPath
          }
          $visualStudioRoots += @(
            "C:\Program Files\Microsoft Visual Studio\2026\Enterprise",
            "C:\Program Files\Microsoft Visual Studio\2026\BuildTools",
            "C:\Program Files\Microsoft Visual Studio\2022\Enterprise",
            "C:\Program Files\Microsoft Visual Studio\2022\BuildTools"
          )

          $candidateDirs = @()
          foreach ($vsRoot in ($visualStudioRoots | Where-Object { $_ } | Select-Object -Unique)) {
            $redistRoot = Join-Path $vsRoot "VC/Redist/MSVC"
            if (Test-Path $redistRoot) {
              $candidateDirs += Get-ChildItem $redistRoot -Directory |
                Sort-Object Name -Descending |
                ForEach-Object { Get-ChildItem (Join-Path $_.FullName "x64") -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue }
            }
          }
          $candidateDirs += Join-Path $env:SystemRoot "System32"

          foreach ($dll in $dllNames) {
            $source = $null
            foreach ($dir in $candidateDirs) {
              $path = Join-Path $dir $dll
              if (Test-Path $path) {
                $source = $path
                break
              }
            }
            if (-not $source) {
              $source = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio",(Join-Path $env:SystemRoot "System32") -Filter $dll -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1 -ExpandProperty FullName
            }
            if (-not $source) {
              throw "Missing required MSVC CRT DLL: $dll"
            }
            Write-Host "Copying $dll from $source"
            Copy-Item $source $releaseDir
          }

      - name: Upload runtime bundle
        if: ${{ !inputs.package_release_artifacts }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

      - name: Install Inno Setup
        if: ${{ inputs.package_release_artifacts }}
        run: choco install innosetup -y

      - name: Compression
        if: ${{ inputs.package_release_artifacts }}
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ciyue-windows.zip

      - name: Build exe
        if: ${{ inputs.package_release_artifacts }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" inno_setup.iss

      - name: Upload release artifacts
        if: ${{ inputs.package_release_artifacts }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ciyue-installer.exe
            ciyue-windows.zip
          if-no-files-found: error
