name: Linux Build

on:
  workflow_call:
    inputs:
      flutter_version:
        required: true
        type: string
      workflow_profile:
        required: false
        type: string
        default: "ci"
      artifact_name:
        required: false
        type: string
        default: "Linux"
      include_metadata_defines:
        required: false
        type: boolean
        default: false
      include_dev_define:
        required: false
        type: boolean
        default: false
      package_release_artifacts:
        required: false
        type: boolean
        default: false
      extra_build_args:
        required: false
        type: string
        default: ""

jobs:
  build-linux:
    name: Build Linux (${{ inputs.workflow_profile }})
    runs-on: ubuntu-latest
    container:
      # Official Arch base-devel image from 2024-06-22. Pin the digest so a
      # rolling registry tag cannot silently raise the glibc build baseline.
      image: docker.io/archlinux/archlinux@sha256:5d1e369287cc90a15fcdc82bb362b206742676912bb8110411b5be24ab45bbca
    env:
      # Keep the complete package set on a GLIBC 2.39 snapshot. This stays
      # within the GLIBC 2.35-2.41 compatibility range while retaining the
      # compatible WPEWebKit 2.44.2 stack.
      ARCHLINUX_ARCHIVE_DATE: 2024/07/01
      ARCHLINUX_PACKAGE_SET: 2024-07-01-glibc-2.39-v1
      ARCHLINUX_GLIBC_VERSION: "2.39"
      ARCHLINUX_GLIBC_PACKAGE_VERSION: "2.39+r52+gf8e4623421-1"
    steps:
      - uses: actions/checkout@v6

      - name: Cache archived Arch packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: archlinux-packages-${{ runner.arch }}-${{ env.ARCHLINUX_PACKAGE_SET }}

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          printf 'Server = https://archive.archlinux.org/repos/%s/$repo/os/$arch\n' "$ARCHLINUX_ARCHIVE_DATE" > /etc/pacman.d/mirrorlist

          # Archived repositories do not provide signed database files and
          # some historical package signing keys are expired. Use a temporary
          # config only while resolving this pinned package set; the image's
          # normal pacman configuration is never modified.
          cp /etc/pacman.conf /tmp/pacman-ci.conf
          sed -i \
            -e 's/^SigLevel[[:space:]]*=.*/SigLevel = Optional TrustAll/' \
            -e 's/^LocalFileSigLevel[[:space:]]*=.*/LocalFileSigLevel = Optional TrustAll/' \
            /tmp/pacman-ci.conf

          # The base image is from before the archive snapshot, so this is an
          # upgrade to the pinned snapshot, never a downgrade of a rolling
          # image.
          pacman --config /tmp/pacman-ci.conf -Syyu \
            --noconfirm --disable-download-timeout
          pacman --config /tmp/pacman-ci.conf -S --needed \
            --noconfirm --disable-download-timeout \
            "glibc=$ARCHLINUX_GLIBC_PACKAGE_VERSION" \
            curl dpkg git jq clang cmake ninja patchelf python rpm-tools \
            unzip wget xz gtk3 gstreamer libayatana-appindicator \
            libkeybinder3 libsecret wpewebkit

          git config --global --add safe.directory '*'
          pacman -Q glibc wpewebkit libwpe wpebackend-fdo
          test "$(pacman -Q glibc | awk '{print $2}')" = "$ARCHLINUX_GLIBC_PACKAGE_VERSION"
          test "$(getconf GNU_LIBC_VERSION | awk '{print $2}')" = "$ARCHLINUX_GLIBC_VERSION"
          test "$(pkg-config --modversion wpe-webkit-2.0)" = "2.44.2"
          rm -f /tmp/pacman-ci.conf

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch flutter_inappwebview for archived WPEWebKit
        run: |
          python3 <<'PY'
          from pathlib import Path

          vendored = Path("packages/flutter_inappwebview_linux/linux/in_app_webview")
          if vendored.is_dir():
              plugin_dir = vendored
          else:
              pub_cache = Path.home() / ".pub-cache"
              candidates = sorted(pub_cache.glob("hosted/*/flutter_inappwebview_linux-*/linux/in_app_webview"))
              if not candidates:
                  raise SystemExit("flutter_inappwebview_linux package not found")
              plugin_dir = candidates[-1]
          settings = plugin_dir / "in_app_webview_settings.cc"
          webview = plugin_dir / "in_app_webview.cc"

          def replace_once(text, old, new, path):
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"expected snippet not found in {path}: {old!r}")
              return text.replace(old, new, 1)

          def patch_theme_color_guard(text, path):
              guard_start = """#if !WEBKIT_CHECK_VERSION(2, 50, 0)\n  return std::nullopt;\n#else\n  WebKitColor color;"""
              if guard_start not in text:
                  text = replace_once(
                      text,
                      """  WebKitColor color;\n  gboolean hasColor = webkit_web_view_get_theme_color(webview_, &color);""",
                      """#if !WEBKIT_CHECK_VERSION(2, 50, 0)\n  return std::nullopt;\n#else\n  WebKitColor color;\n  gboolean hasColor = webkit_web_view_get_theme_color(webview_, &color);""",
                      path,
                  )

              guard_pos = text.find(guard_start)
              return_pos = text.find("return std::string(hexColor);", guard_pos)
              if return_pos == -1:
                  raise SystemExit(f"theme color return not found in {path}")

              endif_pos = text.find("#endif", return_pos)
              close_pos = text.find("\n}", return_pos)
              if close_pos == -1:
                  raise SystemExit(f"theme color function close not found in {path}")
              if endif_pos == -1 or endif_pos > close_pos:
                  text = text[:close_pos] + "\n#endif" + text[close_pos:]
              return text

          replacements = {
              settings: {
                  """  if (!webRTCUdpPortsRange.empty()) {\n    webkit_settings_set_webrtc_udp_ports_range(settings, webRTCUdpPortsRange.c_str());\n  }""": """#if WEBKIT_CHECK_VERSION(2, 48, 0)\n  if (!webRTCUdpPortsRange.empty()) {\n    webkit_settings_set_webrtc_udp_ports_range(settings, webRTCUdpPortsRange.c_str());\n  }\n#endif""",
                  """  webkit_settings_set_enable_2d_canvas_acceleration(settings, enable2DCanvasAcceleration);""": """#if WEBKIT_CHECK_VERSION(2, 46, 0)\n  webkit_settings_set_enable_2d_canvas_acceleration(settings, enable2DCanvasAcceleration);\n#endif""",
              },
          }

          for path, file_replacements in replacements.items():
              text = path.read_text()
              for old, new in file_replacements.items():
                  text = replace_once(text, old, new, path)
              path.write_text(text)

          webview.write_text(patch_theme_color_guard(webview.read_text(), webview))

          print(f"Patched {plugin_dir}")
          PY

      - name: Build Linux
        shell: bash
        run: |
          BUILD_ARGS="${{ inputs.extra_build_args }}"
          if [[ "${{ inputs.include_dev_define }}" == "true" ]]; then
            BUILD_ARGS="$BUILD_ARGS --dart-define=DEV=true"
          fi
          if [[ "${{ inputs.include_metadata_defines }}" == "true" ]]; then
            COMMIT_HASH="${GITHUB_SHA:0:7}"
            if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              COMMIT_HASH="$(git rev-parse --short HEAD)"
            fi
            BUILD_ARGS="$BUILD_ARGS --dart-define=GIT_COMMIT_HASH=$COMMIT_HASH --dart-define=BUILD_TIMESTAMP=$(date +%s)"
          fi
          flutter build linux $BUILD_ARGS

      - name: Normalize Flutter Linux bundle path
        shell: bash
        run: |
          set -euxo pipefail
          legacy_release_dir="build/linux/x64/release"
          if [[ -d "$legacy_release_dir/bundle" ]]; then
            exit 0
          fi

          bundle_binary=$(find build/linux/x64 -type f \
            -path '*/release/bundle/ciyue' -print -quit)
          if [[ -z "$bundle_binary" ]]; then
            echo "Could not locate the Flutter Linux release bundle" >&2
            find build/linux/x64 -maxdepth 6 -type f -name ciyue -print >&2
            exit 1
          fi

          release_dir=$(dirname "$(dirname "$bundle_binary")")
          relative_release_dir=$(realpath --relative-to="build/linux/x64" "$release_dir")
          ln -s "$relative_release_dir" "$legacy_release_dir"

      - name: Create WPE symlinks
        run: |
          cd build/linux/x64/release/bundle/lib/
          for soname in \
            libwpe-1.0.so.1 \
            libWPEWebKit-2.0.so.1 \
            libWPEBackend-fdo-1.0.so.1; do
            if [[ -e "$soname" ]]; then
              continue
            fi
            target=$(find . -maxdepth 1 -type f -name "$soname.*" -printf '%f\n' | sort -V | tail -n 1)
            if [[ -z "$target" ]]; then
              echo "Missing $soname.* in bundled libraries" >&2
              exit 1
            fi
            ln -s "$target" "$soname"
          done

      - name: Bundle Libraries
        run: |
          BUNDLE_LIB_DIR="build/linux/x64/release/bundle/lib"

          for lib in \
            libicui18n.so libicuuc.so libicudata.so libjpeg.so libxml2.so \
            libjxl.so libjxl_cms.so libjxl_threads.so libavif.so \
            libdav1d.so librav1e.so libSvtAv1Enc.so libaom.so libyuv.so \
            libsharpyuv.so libharfbuzz-icu.so libatomic.so libwebpdemux.so \
            libwoff2dec.so libwoff2common.so libhwy.so \
            libbrotlidec.so libbrotlienc.so libbrotlicommon.so; do
            src=$(find /usr/lib -maxdepth 1 -type f \
              \( -name "$lib.*" -o -name "$lib" \) \
              -printf '%p\n' | sort -V | tail -n 1)
            if [[ -z "$src" ]]; then
              echo "Missing $lib in /usr/lib" >&2
              exit 1
            fi

            # Copy under the SONAME, not the package's fully-versioned filename
            # (for example libicuuc.so.75 rather than libicuuc.so.75.1).
            soname=$(patchelf --print-soname "$src")
            if [[ -z "$soname" ]]; then
              echo "Missing SONAME in $src" >&2
              exit 1
            fi
            cp -L "$src" "$BUNDLE_LIB_DIR/$soname"
            patchelf --remove-rpath "$BUNDLE_LIB_DIR/$soname"
          done

          # WPE WebKit launches its network and web processes from the
          # compile-time libexec directory. Keep those helpers and resources
          # beside the bundled libraries, then rewrite that directory to a
          # relative path so AppImage/deb/rpm installs remain relocatable.
          WPE_RUNTIME_DIR="$BUNDLE_LIB_DIR/wpe-webkit-2.0"
          rm -rf "$WPE_RUNTIME_DIR"
          cp -a /usr/lib/wpe-webkit-2.0/. "$WPE_RUNTIME_DIR/"

          WPE_WEBKIT_LIB=$(find "$BUNDLE_LIB_DIR" -maxdepth 1 -type f \
            -name 'libWPEWebKit-2.0.so.*' -print | sort -V | tail -n 1)
          if [[ -z "$WPE_WEBKIT_LIB" ]]; then
            echo "Missing bundled libWPEWebKit-2.0 library" >&2
            exit 1
          fi
          python3 - "$WPE_WEBKIT_LIB" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          data = path.read_bytes()
          old = b"/usr/lib/wpe-webkit-2.0"
          new = b"./lib/wpe-webkit-2.0/./"
          if len(old) != len(new):
              raise SystemExit("WPE libexec path replacement changed length")
          count = data.count(old)
          if count == 0:
              raise SystemExit(f"WPE libexec path not found in {path}")
          path.write_bytes(data.replace(old, new))
          print(f"Patched {path} ({count} path references)")
          PY

          for helper in WPENetworkProcess WPEWebProcess; do
            patchelf --set-rpath '$ORIGIN/..' "$WPE_RUNTIME_DIR/$helper"
          done

          BUNDLE_DIR="build/linux/x64/release/bundle"
          patchelf --force-rpath --set-rpath '$ORIGIN/lib' "$BUNDLE_DIR/ciyue"
          mv "$BUNDLE_DIR/ciyue" "$BUNDLE_DIR/ciyue.bin"
          cp linux/packaging/ciyue-launcher.sh "$BUNDLE_DIR/ciyue"
          chmod +x "$BUNDLE_DIR/ciyue"

      - name: Verify Linux bundle dependencies
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="build/linux/x64/release/bundle"
          export LD_LIBRARY_PATH="$BUNDLE_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          missing=0
          while IFS= read -r -d "" file; do
            if ! file "$file" | grep -q "ELF"; then
              continue
            fi
            unresolved=$(ldd "$file" 2>&1 | grep "not found" || true)
            if [[ -n "$unresolved" ]]; then
              printf "Unresolved dependencies in %s:\n%s\n" "$file" "$unresolved" >&2
              missing=1
            fi
          done < <(find "$BUNDLE_DIR" -type f -print0)
          if (( missing != 0 )); then
            exit 1
          fi

      - name: Compression
        if: ${{ inputs.package_release_artifacts }}
        run: tar -cJvf ciyue-linux.tar.xz build/linux/x64/release/bundle/*

      - name: Build AppImage
        if: ${{ inputs.package_release_artifacts }}
        run: |
          wget -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          mv appimagetool /usr/local/bin/

          ./tools/build_appimage.sh
          mv Ciyue-x86_64.AppImage Ciyue-latest-x86_64.AppImage
          mv Ciyue-x86_64.AppImage.zsync Ciyue-latest-x86_64.AppImage.zsync

      - name: Build Deb
        if: ${{ inputs.package_release_artifacts }}
        run: |
          ./tools/build_deb.sh
          mv *.deb ciyue-x86_64.deb

      - name: Build rpm
        if: ${{ inputs.package_release_artifacts }}
        run: |
          ./tools/build_rpm.sh
          mv ciyue-*.x86_64.rpm ciyue-x86_64.rpm

      - name: Upload bundle
        if: ${{ !inputs.package_release_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: build/linux/x64/release/bundle/
          if-no-files-found: error

      - name: Upload release artifacts
        if: ${{ inputs.package_release_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            ciyue-linux.tar.xz
            Ciyue-latest-x86_64.AppImage
            *.zsync
            ciyue-x86_64.deb
            ciyue-x86_64.rpm
          if-no-files-found: error
