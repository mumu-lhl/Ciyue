name: Android Build

on:
  workflow_call:
    inputs:
      flutter_version:
        required: true
        type: string
      workflow_profile:
        required: false
        type: string
        default: "ci"
      build_mode:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: "APK"
      enable_build_cache:
        required: false
        type: boolean
        default: false
      enable_gradle_cache:
        required: false
        type: boolean
        default: false
      signing_required:
        required: false
        type: boolean
        default: true
      include_metadata_defines:
        required: false
        type: boolean
        default: false
      include_dev_define:
        required: false
        type: boolean
        default: false

jobs:
  build-android:
    name: Build Android (${{ inputs.workflow_profile }}-${{ inputs.build_mode }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Install dependencies
        run: flutter pub get

      - name: Validate signing secrets
        if: ${{ inputs.signing_required }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_PROPERTIES" ]; then
            echo "Missing KEYSTORE_BASE64 or KEY_PROPERTIES secrets for required Android signing."
            exit 1
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ inputs.signing_required || env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks

      - name: Create key.properties
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        if: ${{ inputs.signing_required || env.KEY_PROPERTIES != '' }}
        run: |
          echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties

      - name: Cache Flutter Build
        if: ${{ inputs.enable_build_cache }}
        uses: actions/cache@v5
        with:
          path: |
            .dart_tool
            build
          key: ${{ runner.os }}-build-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Cache Gradle
        if: ${{ inputs.enable_gradle_cache }}
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android
        shell: bash
        run: |
          # Baked once per job so every APK of this build carries the
          # same commit hash and timestamp; the release branches below
          # append them, the dev branch builds its own EXTRA_ARGS.
          METADATA_ARGS=""
          if [[ "${{ inputs.include_metadata_defines }}" == "true" ]]; then
            METADATA_ARGS="--dart-define=GIT_COMMIT_HASH=$(git rev-parse --short=7 HEAD) --dart-define=BUILD_TIMESTAMP=$(date +%s)"
          fi
          case "${{ inputs.build_mode }}" in
            ci_full_dev)
              EXTRA_ARGS=""
              if [[ "${{ inputs.include_dev_define }}" == "true" ]]; then
                EXTRA_ARGS="$EXTRA_ARGS --dart-define=DEV=true"
              fi
              if [[ "${{ inputs.include_metadata_defines }}" == "true" ]]; then
                EXTRA_ARGS="$EXTRA_ARGS --dart-define=GIT_COMMIT_HASH=$(git rev-parse --short=7 HEAD) --dart-define=BUILD_TIMESTAMP=$(date +%s)"
              fi
              flutter build apk --flavor full-dev $EXTRA_ARGS
              ;;
            release_common)
              flutter build apk --flavor=common $METADATA_ARGS
              flutter build apk --flavor=common --split-per-abi --target-platform=android-arm64 $METADATA_ARGS
              flutter build apk --flavor=common --split-per-abi --target-platform=android-arm $METADATA_ARGS
              flutter build apk --flavor=common --split-per-abi --target-platform=android-x64 $METADATA_ARGS
              ;;
            release_full)
              flutter build apk --flavor=full $METADATA_ARGS
              flutter build apk --flavor=full --split-per-abi --target-platform=android-arm64 $METADATA_ARGS
              flutter build apk --flavor=full --split-per-abi --target-platform=android-arm $METADATA_ARGS
              flutter build apk --flavor=full --split-per-abi --target-platform=android-x64 $METADATA_ARGS
              ;;
            *)
              echo "Unsupported build_mode: ${{ inputs.build_mode }}"
              exit 1
              ;;
          esac

      # Assert the versionCode encoded in each APK, not merely the Gradle DSL
      # value. Flutter has changed ABI offsets in the past (see issue #884).
      - name: Validate release APK version codes
        if: ${{ inputs.build_mode == 'release_common' || inputs.build_mode == 'release_full' }}
        shell: bash
        run: |
          set -euo pipefail
          build_number="$(sed -nE 's/^version: [^+]+\+([0-9]+).*/\1/p' pubspec.yaml)"
          if [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
            echo "Cannot determine pubspec build number" >&2
            exit 1
          fi

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          aapt="$build_tools/aapt"
          if [[ ! -x "$aapt" ]]; then
            echo "Android aapt not found: $aapt" >&2
            exit 1
          fi

          flavor=common
          if [[ "${{ inputs.build_mode }}" == 'release_full' ]]; then
            flavor=full
          fi

          for entry in 'universal:4' 'x86_64:1' 'armeabi-v7a:2' 'arm64-v8a:3'; do
            abi="${entry%%:*}"
            suffix="${entry##*:}"
            apk="build/app/outputs/flutter-apk/app-${abi}-${flavor}-release.apk"
            if [[ "$abi" == 'universal' ]]; then
              apk="build/app/outputs/flutter-apk/app-${flavor}-release.apk"
            fi

            expected=$((10#$build_number * 10000 + suffix * 1000))
            actual="$("$aapt" dump badging "$apk" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -n 1)"
            echo "$apk: expected=$expected actual=$actual"
            if [[ "$actual" != "$expected" ]]; then
              echo "Unexpected versionCode in $apk" >&2
              exit 1
            fi
          done

      - name: Rename common APKs
        if: ${{ inputs.build_mode == 'release_common' }}
        run: |
          cd build/app/outputs/flutter-apk
          mv app-common-release.apk ciyue-universal-release.apk
          mv app-armeabi-v7a-common-release.apk ciyue-armeabi-v7a-release.apk
          mv app-arm64-v8a-common-release.apk ciyue-arm64-v8a-release.apk
          mv app-x86_64-common-release.apk ciyue-x86_64-release.apk

      - name: Rename full APKs
        if: ${{ inputs.build_mode == 'release_full' }}
        run: |
          cd build/app/outputs/flutter-apk
          mv app-full-release.apk ciyue-universal-full.apk
          mv app-armeabi-v7a-full-release.apk ciyue-armeabi-v7a-full.apk
          mv app-arm64-v8a-full-release.apk ciyue-arm64-v8a-full.apk
          mv app-x86_64-full-release.apk ciyue-x86_64-full.apk

      - name: Upload CI APK
        if: ${{ inputs.build_mode == 'ci_full_dev' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: build/app/outputs/flutter-apk/app-full-dev-release.apk
          if-no-files-found: error

      - name: Upload common release APKs
        if: ${{ inputs.build_mode == 'release_common' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: build/app/outputs/flutter-apk/ciyue-*-release.apk
          if-no-files-found: error

      - name: Upload full release APKs
        if: ${{ inputs.build_mode == 'release_full' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: build/app/outputs/flutter-apk/ciyue-*-full.apk
          if-no-files-found: error
