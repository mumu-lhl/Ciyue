name: Nightly Release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: write

jobs:
  check-activity:
    name: Check repository activity
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check_commits.outputs.should_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Check for recent commits
        id: check_commits
        run: |
          LAST_COMMIT_TIMESTAMP=$(git log -1 --format=%ct)
          NOW_TIMESTAMP=$(date +%s)
          # If the last commit is older than 24 hours (86400 seconds), skip the build
          if (( (NOW_TIMESTAMP - LAST_COMMIT_TIMESTAMP) > 86400 )); then
            echo "No new commits in the last 24 hours. Skipping build."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "New commits found. Proceeding with build."
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

  build-android:
    needs: check-activity
    if: needs.check-activity.outputs.should_run == 'true'
    uses: ./.github/workflows/android-build.yml
    secrets: inherit
    with:
      flutter_version: 3.50.0
      workflow_profile: nightly
      include_metadata_defines: true
      build_mode: release_common
      artifact_name: APK
      enable_build_cache: true
      enable_gradle_cache: true
      signing_required: true

  build-android-full:
    needs: check-activity
    if: needs.check-activity.outputs.should_run == 'true'
    uses: ./.github/workflows/android-build.yml
    secrets: inherit
    with:
      flutter_version: 3.50.0
      workflow_profile: nightly
      include_metadata_defines: true
      build_mode: release_full
      artifact_name: APK-FULL
      enable_build_cache: true
      enable_gradle_cache: true
      signing_required: true

  build-windows:
    needs: check-activity
    if: needs.check-activity.outputs.should_run == 'true'
    uses: ./.github/workflows/windows-build.yml
    with:
      flutter_version: 3.50.0
      workflow_profile: nightly
      artifact_name: Windows
      enable_build_cache: true
      package_release_artifacts: true

  build-linux:
    needs: check-activity
    if: needs.check-activity.outputs.should_run == 'true'
    uses: ./.github/workflows/linux-build.yml
    with:
      flutter_version: 3.50.0
      workflow_profile: nightly
      artifact_name: Linux
      package_release_artifacts: true

  build-macos:
    needs: check-activity
    if: needs.check-activity.outputs.should_run == 'true'
    uses: ./.github/workflows/macos-build.yml
    with:
      flutter_version: 3.50.0
      workflow_profile: nightly
      include_metadata_defines: true
      artifact_name: macOS
      package_release_artifacts: true

  build-flatpak:
    needs: [check-activity, build-linux]
    if: needs.check-activity.outputs.should_run == 'true'
    uses: ./.github/workflows/flatpak-build.yml

  build-extension:
    needs: check-activity
    if: needs.check-activity.outputs.should_run == 'true'
    uses: ./.github/workflows/browser-extension-build.yml
    with:
      workflow_profile: nightly
      artifact_name: Extension

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      [
        check-activity,
        build-android,
        build-android-full,
        build-windows,
        build-linux,
        build-macos,
        build-flatpak,
        build-extension,
      ]
    if: needs.check-activity.outputs.should_run == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Generate release body
        id: release_body
        env:
          RELEASE_ASSET_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/nightly
        run: |
          cat <<EOF >> $GITHUB_OUTPUT
          body<<DELIMITER
          Latest commit: $(git log -1 --pretty=%s)
          Commit hash: $(git rev-parse --short=7 HEAD)
          Build date: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          DELIMITER
          EOF

      - name: Delete existing nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --cleanup-tag -y || true

      - uses: ncipollo/release-action@v1
        with:
          artifacts: "APK/ciyue-*-release.apk,APK-FULL/ciyue-*-full.apk,Windows/*,Linux/*,macOS/*,Flatpak/ciyue-x86_64.flatpak,Extension/*"
          tag: "nightly"
          name: "Nightly Build"
          body: ${{ steps.release_body.outputs.body }}
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
