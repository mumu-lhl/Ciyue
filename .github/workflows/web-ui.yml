name: Web UI

on:
  push:
    paths:
      - "web_ui/**"
      - ".github/workflows/web-ui.yml"
  pull_request:
    paths:
      - "web_ui/**"
      - ".github/workflows/web-ui.yml"

jobs:
  check-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_ui
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          working-directory: web_ui
          runtime: node@lts
          cache: true
          require-lockfile: true

      - name: Check code formatting (oxfmt)
        run: pnpm run format:check

      - name: Lint (oxlint)
        run: pnpm run lint --deny-warnings

      - name: Type check (tsc)
        run: pnpm run compile

      - name: Run unit tests (vitest)
        run: pnpm test

      - name: Build Web UI
        run: pnpm run build
